; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:genericSTM32F103C8]
platform = ststm32
board = genericSTM32F103C8
framework = arduino




lib_deps =
  # RECOMMENDED
  # Accept new functionality in a backwards compatible manner and patches
  paulstoffregen/OneWire @ ^2.3.8

; change microcontroller
board_build.mcu = stm32f103c8t6

;---===Если нужна отладка JLINK - РАЗКОМЕНТИРОВАТЬ===---
;debug_init_break = tbreak
debug_tool = jlink
upload_protocol = jlink


;---===Если только прошивка STLINK(v1,v2) - РАЗКОМЕНТИРОВАТЬ и закоментировать выше===---
;debug_tool = stlink

;board_build.f_cpu = 128000000L   ; раскоментировать для разгона в 2 раза
;build_type = release    
debug_speed = 4000

; Old filters are superseded by MeasurementFilters.h. Local INA226 is the sole driver.
build_src_filter = +<*> -<filters.cpp>
lib_ignore = INA226
monitor_speed = 115200
build_flags = -flto
